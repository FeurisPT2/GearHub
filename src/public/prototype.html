<!doctype html>
<!--
  GearHub × Astryx Design System Prototypes
  Built with React 19 + @astryxdesign/core + @astryxdesign/theme-neutral via ESM/CDN.
  Strictly conforms to Astryx conventions:
  - Components handle all layout (Stack, HStack, VStack, Card, Section).
  - No raw hex/px — tokens & component props only.
  - Theme switching via <Theme mode={...} theme={neutralTheme}>.
-->
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GearHub × Astryx Prototypes · Trạm Gear & Laptop IT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" />
    
    <!-- Astryx Reset, Core Component CSS & Neutral Theme Stylesheet -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@astryxdesign/core@0.7.16/src/reset.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@astryxdesign/core@0.7.16/dist/astryx.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@astryxdesign/theme-neutral@0.7.16/dist/theme.css" />

    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19.2.0",
          "react/jsx-runtime": "https://esm.sh/react@19.2.0/jsx-runtime",
          "react-dom": "https://esm.sh/react-dom@19.2.0",
          "react-dom/client": "https://esm.sh/react-dom@19.2.0/client",
          "htm": "https://esm.sh/htm@3.1.1",
          "@astryxdesign/core": "https://esm.sh/@astryxdesign/core@0.7.16?external=react,react-dom",
          "@astryxdesign/theme-neutral": "https://esm.sh/@astryxdesign/theme-neutral@0.7.16?external=react,react-dom"
        }
      }
    </script>

    <style>
      body {
        margin: 0;
        padding: 0;
        background: var(--color-background-primary, #f9fafb);
        color: var(--color-text-primary, #111827);
        font-family: var(--font-family-body, 'Figtree', sans-serif);
        -webkit-font-smoothing: antialiased;
      }
      #root:empty::after {
        content: 'Đang tải Astryx Prototypes…';
        display: block;
        padding: 3rem;
        text-align: center;
        font-weight: 600;
        color: var(--color-text-secondary, #6b7280);
      }
      .product-img {
        width: 100%;
        height: 180px;
        object-fit: cover;
        border-radius: var(--radius-md, 8px);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="module">
      import * as React from 'react';
      import { createRoot } from 'react-dom/client';
      import htm from 'htm';
      import {
        Theme,
        Card,
        Stack,
        HStack,
        VStack,
        Heading,
        Text,
        Button,
        Badge,
        Divider,
        Banner,
        StatusDot,
        TextInput,
        Field
      } from '@astryxdesign/core';
      import { neutralTheme } from '@astryxdesign/theme-neutral';

      const h = htm.bind(React.createElement);

      const SAMPLE_PRODUCTS = [
        {
          id: 'p1',
          name: 'Vệ Sinh Laptop MX-4 & Tối Ưu Win/Mac',
          category: 'service',
          price: '79.000₫',
          tag: 'Lấy Liền 30-45p',
          image: '/images/products/laptop-spa.jpg',
          desc: 'Tra keo Arctic MX-4, thổi bụi quạt tản nhiệt, giảm 5-10°C tức thì cho mùa đồ án tại Sảnh C.'
        },
        {
          id: 'p2',
          name: 'Bàn Phím Cơ Aula F75 Tri-Mode',
          category: 'rental',
          price: '20.000₫ / ngày',
          tag: '0đ Cọc MSSV',
          image: '/images/products/aula-f75.jpg',
          desc: 'Gasket mount, switch êm ái thích hợp gõ code tại giảng đường hoặc phòng KTX.'
        },
        {
          id: 'p3',
          name: 'Chuột Không Dây Logitech MX Master 3S',
          category: 'rental',
          price: '25.000₫ / ngày',
          tag: '0đ Cọc MSSV',
          image: '/images/products/mx-master-3s.jpg',
          desc: 'Cuộn vô cực MagSpeed, kết nối đa thiết bị, công thái học hỗ trợ đồ họa và lập trình.'
        },
        {
          id: 'p4',
          name: 'Hub Type-C 8-in-1 Baseus Metal Gleam',
          category: 'rental',
          price: '15.000₫ / ngày',
          tag: 'Hỗ Trợ Thuyết Trình',
          image: '/images/products/baseus-hub.jpg',
          desc: 'Cổng HDMI 4K kết nối máy chiếu hội trường, sạc PD 100W, khe cắm SD & cổng LAN Gigabit.'
        }
      ];

      function PrototypeApp() {
        const [themeMode, setThemeMode] = React.useState('system');
        const [activeTab, setActiveTab] = React.useState('catalog');
        const [bookingSuccess, setBookingSuccess] = React.useState(false);
        const [formData, setFormData] = React.useState({
          name: '',
          mssv: '',
          service: 'Vệ Sinh Laptop MX-4'
        });

        return h`
          <${Theme} theme=${neutralTheme} mode=${themeMode}>
            <${Stack} padding=${4} gap=${5} style=${{ maxWidth: '1100px', margin: '0 auto' }}>
              
              <!-- TOP HEADER NAV BAR -->
              <${Card} padding=${3} elevation="low">
                <${HStack} justify="space-between" align="center" wrap="wrap" gap=${2}>
                  <${HStack} align="center" gap=${2}>
                    <${StatusDot} status="success" />
                    <${Heading} level=${3} style=${{ margin: 0, fontWeight: 800 }}>GearHub × Astryx</${Heading}>
                    <${Badge}>4</${Badge}>
                  </${HStack}>

                  <${HStack} align="center" gap=${2}>
                    <!-- Mode Switcher -->
                    <${HStack} gap=${1}>
                      <${Button}
                        variant=${themeMode === 'light' ? 'primary' : 'ghost'}
                        label="Sáng"
                        size="sm"
                        onClick=${() => setThemeMode('light')}
                      >☀️ Sáng<//>
                      <${Button}
                        variant=${themeMode === 'dark' ? 'primary' : 'ghost'}
                        label="Tối"
                        size="sm"
                        onClick=${() => setThemeMode('dark')}
                      >🌙 Tối<//>
                      <${Button}
                        variant=${themeMode === 'system' ? 'primary' : 'ghost'}
                        label="Hệ Thống"
                        size="sm"
                        onClick=${() => setThemeMode('system')}
                      >💻 Tự Động<//>
                    <//>

                    <${Button}
                      variant="secondary"
                      label="Về Cửa Hàng"
                      size="sm"
                      onClick=${() => window.location.href = '/shop'}
                    >Trang Chủ Shop →<//>
                  </${HStack}>
                <//>
              <//>

              <!-- HERO BANNER -->
              <${Banner}
                variant="info"
                title="Astryx Design System Interactive Prototypes"
                description="Bộ khung mẫu giao diện thử nghiệm xây dựng hoàn toàn từ thư viện 174 Component Astryx (Meta Open Source) kết hợp Theme Neutral, phục vụ hệ thống chăm sóc thiết bị & thuê gear sinh viên IT tại Sảnh C."
              />

              <!-- PROTOTYPE NAVIGATION TABS -->
              <${Card} padding=${2} elevation="flat">
                <${HStack} gap=${2}>
                  <${Button}
                    variant=${activeTab === 'catalog' ? 'primary' : 'ghost'}
                    label="Prototype Cửa Hàng & Danh Mục"
                    onClick=${() => setActiveTab('catalog')}
                  >1. Prototype Cửa Hàng & Thuê Gear<//>
                  <${Button}
                    variant=${activeTab === 'booking' ? 'primary' : 'ghost'}
                    label="Prototype Đặt Lịch Sảnh C"
                    onClick=${() => setActiveTab('booking')}
                  >2. Prototype Đặt Lịch Lấy Liền<//>
                  <${Button}
                    variant=${activeTab === 'components' ? 'primary' : 'ghost'}
                    label="Thư Viện Astryx Components"
                    onClick=${() => setActiveTab('components')}
                  >3. Astryx UI Showcase<//>
                <//>
              <//>

              <!-- TAB 1: CATALOG & PRODUCT CARDS -->
              ${activeTab === 'catalog' && h`
                <${VStack} gap=${4}>
                  <${HStack} justify="space-between" align="baseline">
                    <${VStack} gap=${1} align="start">
                      <${Heading} level=${2} style=${{ margin: 0 }}>Danh Mục Thiết Bị & Dịch Vụ Sảnh C</${Heading}>
                      <${Text} style=${{ color: 'var(--color-text-secondary)' }}>
                        Đồng giá sinh viên - Lấy liền sau 30 phút - Miễn cọc tiền mặt với thẻ SV.
                      </${Text}>
                    <//>
                    <${Badge}>4 Dịch Vụ Sẵn Có<//>
                  <//>

                  <${HStack} gap=${3} wrap="wrap" justify="space-between">
                    ${SAMPLE_PRODUCTS.map(product => h`
                      <${Card}
                        key=${product.id}
                        padding=${3}
                        elevation="medium"
                        style=${{ width: 'calc(50% - 12px)', minWidth: '300px', boxSizing: 'border-box' }}
                      >
                        <${VStack} gap=${2} align="start">
                          <img
                            src=${product.image}
                            alt=${product.name}
                            class="product-img"
                            onError=${e => { e.target.src = 'https://images.unsplash.com/photo-1588872657578-7efd1f1555ed?w=600&auto=format&fit=crop&q=80'; }}
                          />
                          <${HStack} justify="space-between" style=${{ width: '100%' }}>
                            <${Text} style=${{ fontSize: '0.8rem', fontWeight: 700, color: '#2563eb' }}>
                              ${product.tag}
                            </${Text}>
                            <${Text} style=${{ fontSize: '1.1rem', fontWeight: 800 }}>
                              ${product.price}
                            </${Text}>
                          <//>
                          <${Heading} level=${4} style=${{ margin: '4px 0', fontSize: '1.15rem' }}>
                            ${product.name}
                          </${Heading}>
                          <${Text} style=${{ fontSize: '0.9rem', color: 'var(--color-text-secondary)', lineHeight: 1.5 }}>
                            ${product.desc}
                          </${Text}>
                          <${Divider} />
                          <${HStack} justify="space-between" style=${{ width: '100%' }}>
                            <${Button}
                              variant="primary"
                              label="Đặt Lịch Ngay"
                              size="sm"
                              onClick=${() => {
                                setFormData(f => ({ ...f, service: product.name }));
                                setActiveTab('booking');
                              }}
                            >Đặt Lịch Lấy Liền<//>
                            <${Button}
                              variant="secondary"
                              label="Chi Tiết"
                              size="sm"
                              onClick=${() => window.location.href = '/shop'}
                            >Xem Thêm<//>
                          <//>
                        <//>
                      <//>
                    `)}
                  <//>
                <//>
              `}

              <!-- TAB 2: BOOKING WIZARD PROTOTYPE -->
              ${activeTab === 'booking' && h`
                <${Card} padding=${5} elevation="medium" style=${{ maxWidth: '680px', margin: '0 auto', width: '100%', boxSizing: 'border-box' }}>
                  <${VStack} gap=${4} align="start">
                    <${VStack} gap=${1} align="start">
                      <${Heading} level=${2} style=${{ margin: 0 }}>Đăng Ký Vệ Sinh Laptop / Thuê Gear Tại Chỗ</${Heading}>
                      <${Text} style=${{ color: 'var(--color-text-secondary)' }}>
                        Trạm kỹ thuật Sảnh C trường ĐHKHTN (ĐHQG-HCM). Lấy máy sau 30-45 phút.
                      </${Text}>
                    <//>

                    ${bookingSuccess && h`
                      <${Banner}
                        variant="success"
                        title="Đăng Ký Thành Công!"
                        description="Mã đặt hẹn của bạn: #GH-${Math.floor(1000 + Math.random() * 9000)}. Hãy mang máy đến bàn kỹ thuật Sảnh C vào khung giờ đã chọn."
                      />
                    `}

                    <${VStack} gap=${3} style=${{ width: '100%' }}>
                      <${VStack} gap=${1} align="start" style=${{ width: '100%' }}>
                        <${Text} style=${{ fontWeight: 600, fontSize: '0.9rem' }}>Họ Và Tên Sinh Viên:</${Text}>
                        <input
                          type="text"
                          placeholder="Ví dụ: Nguyễn Văn An"
                          value=${formData.name}
                          onInput=${e => setFormData({ ...formData, name: e.target.value })}
                          style=${{
                            width: '100%',
                            padding: '10px 14px',
                            borderRadius: '8px',
                            border: '1px solid var(--color-border-primary, #d1d5db)',
                            background: 'var(--color-surface, #fff)',
                            color: 'inherit',
                            fontSize: '0.95rem',
                            boxSizing: 'border-box'
                          }}
                        />
                      <//>

                      <${VStack} gap=${1} align="start" style=${{ width: '100%' }}>
                        <${Text} style=${{ fontWeight: 600, fontSize: '0.9rem' }}>Mã Số Sinh Viên (MSSV):</${Text}>
                        <input
                          type="text"
                          placeholder="Ví dụ: 22120001 (Khoa CNTT)"
                          value=${formData.mssv}
                          onInput=${e => setFormData({ ...formData, mssv: e.target.value })}
                          style=${{
                            width: '100%',
                            padding: '10px 14px',
                            borderRadius: '8px',
                            border: '1px solid var(--color-border-primary, #d1d5db)',
                            background: 'var(--color-surface, #fff)',
                            color: 'inherit',
                            fontSize: '0.95rem',
                            boxSizing: 'border-box'
                          }}
                        />
                      <//>

                      <${VStack} gap=${1} align="start" style=${{ width: '100%' }}>
                        <${Text} style=${{ fontWeight: 600, fontSize: '0.9rem' }}>Dịch Vụ Yêu Cầu:</${Text}>
                        <select
                          value=${formData.service}
                          onChange=${e => setFormData({ ...formData, service: e.target.value })}
                          style=${{
                            width: '100%',
                            padding: '10px 14px',
                            borderRadius: '8px',
                            border: '1px solid var(--color-border-primary, #d1d5db)',
                            background: 'var(--color-surface, #fff)',
                            color: 'inherit',
                            fontSize: '0.95rem',
                            boxSizing: 'border-box'
                          }}
                        >
                          <option value="Vệ Sinh Laptop MX-4">Vệ Sinh Laptop MX-4 (79.000₫)</option>
                          <option value="Spa Laptop Toàn Diện MX-6">Spa Laptop Toàn Diện MX-6 (119.000₫)</option>
                          <option value="Thuê Bàn Phím Cơ Aula F75">Thuê Bàn Phím Cơ Aula F75 (20.000₫/ngày)</option>
                          <option value="Thuê Chuột Logitech MX Master 3S">Thuê Chuột Logitech MX Master 3S (25.000₫/ngày)</option>
                          <option value="Thuê Hub Baseus Type-C">Thuê Hub Baseus Type-C (15.000₫/ngày)</option>
                        </select>
                      <//>

                      <${Divider} />

                      <${HStack} justify="flex-end" gap=${2} style=${{ width: '100%' }}>
                        <${Button}
                          variant="ghost"
                          label="Nhập Lại"
                          onClick=${() => {
                            setFormData({ name: '', mssv: '', service: 'Vệ Sinh Laptop MX-4' });
                            setBookingSuccess(false);
                          }}
                        >Làm Mới<//>
                        <${Button}
                          variant="primary"
                          label="Xác Nhận Đặt Hẹn"
                          onClick=${() => setBookingSuccess(true)}
                        >Xác Nhận Đặt Hẹn Sảnh C →<//>
                      <//>
                    <//>
                  <//>
                <//>
              `}

              <!-- TAB 3: ASTRYX COMPONENT EXPLORER -->
              ${activeTab === 'components' && h`
                <${VStack} gap=${4}>
                  <${Card} padding=${4} elevation="low">
                    <${VStack} gap=${3} align="start">
                      <${Heading} level=${3}>Astryx Buttons & State Styles</${Heading}>
                      <${Text} style=${{ color: 'var(--color-text-secondary)' }}>
                        Các biến thể nút bấm chuẩn trong thư viện Astryx Core với kích thước và trạng thái tương tác:
                      </${Text}>
                      <${HStack} gap=${2} wrap="wrap">
                        <${Button} variant="primary" label="Primary">Primary Action<//>
                        <${Button} variant="secondary" label="Secondary">Secondary Action<//>
                        <${Button} variant="ghost" label="Ghost">Ghost Button<//>
                        <${Button} variant="danger" label="Danger">Danger Action<//>
                      <//>
                    <//>
                  <//>

                  <${Card} padding=${4} elevation="low">
                    <${VStack} gap=${3} align="start">
                      <${Heading} level=${3}>Astryx StatusDots & Badges (Counts)</${Heading}>
                      <${Text} style=${{ color: 'var(--color-text-secondary)' }}>
                        Quy tắc Astryx: Badge chỉ dùng cho số đếm (Counts). StatusDot hiển thị trạng thái hoạt động:
                      </${Text}>
                      <${HStack} gap=${3} align="center">
                        <${HStack} gap=${1} align="center">
                          <${StatusDot} status="success" />
                          <${Text}>Sẵn sàng (Active)</${Text}>
                        <//>
                        <${HStack} gap=${1} align="center">
                          <${StatusDot} status="warning" />
                          <${Text}>Đang bận (Busy)</${Text}>
                        <//>
                        <${HStack} gap=${1} align="center">
                          <${StatusDot} status="neutral" />
                          <${Text}>Ngoại tuyến (Offline)</${Text}>
                        <//>
                        <${Badge}>12 đơn<//>
                        <${Badge}>99+ thông báo<//>
                      <//>
                    <//>
                  <//>

                  <${Card} padding=${4} elevation="low">
                    <${VStack} gap=${3} align="start">
                      <${Heading} level=${3}>Astryx Typography Scale (Neutral Theme)</${Heading}>
                      <${Heading} level=${1}>Heading Level 1 (Trạm GearHub Sảnh C)</${Heading}>
                      <${Heading} level=${2}>Heading Level 2 (Dịch Vụ Laptop & Phụ Kiện IT)</${Heading}>
                      <${Heading} level=${3}>Heading Level 3 (Quy Trình Lấy Liền 30 Phút)</${Heading}>
                      <${Heading} level=${4}>Heading Level 4 (Chính Sách 0đ Tiền Cọc Cho Sinh Viên)</${Heading}>
                      <${Text}>Body Text: Kiểu chữ Figtree tiêu chuẩn của theme Neutral, được tối ưu cho độ dễ đọc cao và độ tương phản đạt chuẩn WCAG AA.</${Text}>
                    <//>
                  <//>
                <//>
              `}

              <!-- FOOTER -->
              <${Divider} />
              <${HStack} justify="space-between" align="center" style=${{ color: 'var(--color-text-secondary)', fontSize: '0.85rem' }}>
                <${Text}>GearHub · Thiết kế với Astryx v0.7.16 & Theme Neutral</${Text}>
                <${HStack} gap=${2}>
                  <${Button} variant="ghost" size="sm" label="Về Cửa Hàng" onClick=${() => window.location.href = '/shop'}>Cửa Hàng<//>
                  <${Button} variant="ghost" size="sm" label="Giỏ Hàng" onClick=${() => window.location.href = '/cart'}>Giỏ Hàng<//>
                <//>
              <//>

            </${Stack}>
          <//>
        `;
      }

      createRoot(document.getElementById('root')).render(h`<${PrototypeApp} />`);
    </script>
  </body>
</html>
